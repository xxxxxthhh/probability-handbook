# 部署到 GitHub Pages。
# 只发布书籍本体（index / 两个附录 / chapters / assets）：
# reference/ 是审定样章存档，CLAUDE.md 约定「构建时不发布」；
# CLAUDE.md / SKELETON.md / README.md 是仓库文档，不属于站点。
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 门禁不过就不部署：链接与锚点、资源引用、目录章节数、实验挂载；再验证门禁本身能报红
      - name: Gate
        run: |
          node tools/check.mjs
          node tools/mutate.mjs

      # 白名单见 tools/publish-list.txt（与门禁共用）
      - name: Assemble site (book only)
        run: |
          mkdir -p _site
          grep -v '^#' tools/publish-list.txt | grep -v '^$' | while read -r p; do cp -R "$p" _site/; done
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
